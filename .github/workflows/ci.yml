name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: teacher_assistant
          POSTGRES_USER: teacher_assistant
          POSTGRES_PASSWORD: teacher_assistant_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teacher_assistant -d teacher_assistant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://teacher_assistant:teacher_assistant_dev_password@localhost:5432/teacher_assistant
      BRAIN_PROVIDER: mock
      LOCAL_STORAGE_ROOT: /tmp/ta-data
      UPLOADS_DIR: /tmp/ta-data/uploads
      ARTIFACTS_DIR: /tmp/ta-data/artifacts
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Migrate to head
        run: python -m alembic upgrade head
      - name: Run tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Static workflow checks
        run: node tests/workflow-ui.test.mjs
      - name: Build
        run: npm run build
